[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lensight"
version = "0.2.0"
description = "The unified PyTorch computer-vision diagnostic, interpretability, and dataset health toolkit."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Lensight Contributors", email = "maintainers@lensight.dev" }]
keywords = [
    "deep-learning",
    "computer-vision",
    "interpretability",
    "explainable-ai",
    "grad-cam",
    "hirescam",
    "pytorch",
    "model-debugging",
    "confidence-calibration",
    "temperature-scaling",
    "dataset-audit",
    "leakage-detection",
    "data-quality",
    "perceptual-hashing",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = [
    "torch>=1.13",
    "numpy>=1.21",
    "pillow>=9.0",
    "scikit-learn>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "torchvision>=0.14"]

[project.scripts]
lensight = "lensight.cli:main"

[project.urls]
Homepage = "https://github.com/csharikrishna/Lensight"
Documentation = "https://csharikrishna.github.io/Lensight/"
Issues = "https://github.com/csharikrishna/Lensight/issues"

[tool.setuptools.packages.find]
include = ["lensight*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
